name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Run Tests
        run: go test -race ./...

      - name: Build Linux amd64 & arm64 Release Tarballs
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          VER="${TAG#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist

          for ARCH in amd64 arm64; do
            STAGE="dist/stage-${ARCH}"
            mkdir -p "${STAGE}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" go build \
              -trimpath \
              -ldflags="-s -w -X github.com/xmg665/xoga/internal/version.Version=${VER} -X github.com/xmg665/xoga/internal/version.Commit=${COMMIT} -X github.com/xmg665/xoga/internal/version.BuildTime=${BUILD_TIME}" \
              -o "${STAGE}/xoga" ./cmd/xoga
            cp configs/xoga.conf configs/xoga.service configs/xoga@.service configs/blockList configs/whiteList configs/dns.yml configs/routes.toml "${STAGE}/"
            tar -czf "dist/xoga-linux-${ARCH}.tar.gz" -C "${STAGE}" .
          done
          ls -lh dist/*.tar.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/xoga-linux-amd64.tar.gz
            dist/xoga-linux-arm64.tar.gz
