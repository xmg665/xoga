name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run Tests
        run: go test -race ./...

      - name: Build Linux amd64 & arm64 Release Tarballs
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${INPUT_TAG}"
          fi
          echo "RELEASE_TAG=${TAG}" >> "${GITHUB_ENV}"
          VER="${TAG#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist

          for ARCH in amd64 arm64; do
            STAGE="dist/stage-${ARCH}"
            mkdir -p "${STAGE}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" go build \
              -trimpath \
              -ldflags="-s -w -X github.com/xmg665/xoga/internal/version.Version=${VER} -X github.com/xmg665/xoga/internal/version.Commit=${COMMIT} -X github.com/xmg665/xoga/internal/version.BuildTime=${BUILD_TIME}" \
              -o "${STAGE}/xoga" ./cmd/xoga
            cp configs/xoga.conf configs/xoga.service configs/xoga@.service configs/blockList configs/whiteList configs/dns.yml configs/routes.toml "${STAGE}/"
            tar -czf "dist/xoga-linux-${ARCH}.tar.gz" -C "${STAGE}" .
          done
          ls -lh dist/*.tar.gz

      - name: Publish GitHub Release (with Retry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${RELEASE_TAG}"
          for attempt in 1 2 3 4 5; do
            echo "Publishing release ${TAG} (attempt ${attempt}/5)..."
            if gh release view "${TAG}" >/dev/null 2>&1; then
              if gh release upload "${TAG}" dist/xoga-linux-amd64.tar.gz dist/xoga-linux-arm64.tar.gz --clobber; then
                echo "Release ${TAG} assets uploaded successfully."
                exit 0
              fi
            else
              if gh release create "${TAG}" dist/xoga-linux-amd64.tar.gz dist/xoga-linux-arm64.tar.gz --title "${TAG}" --generate-notes; then
                echo "Release ${TAG} created successfully."
                exit 0
              fi
            fi
            sleep $((attempt * 5))
          done
          echo "Failed to publish GitHub release ${TAG} after 5 attempts." >&2
          exit 1

      - name: Log in to GitHub Container Registry
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Multi-Arch Docker Image to GHCR
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.RELEASE_TAG }}
          tags: |
            ghcr.io/xmg665/xoga:latest
            ghcr.io/xmg665/xoga:${{ env.RELEASE_TAG }}
