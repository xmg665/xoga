# ==================== 基础对接配置 (兼容 soga.conf) ====================
type=v2board
server_type=vless
node_id=1
api=webapi

# webapi 对接信息
webapi_url=
webapi_key=

# 手动证书配置
cert_file=
key_file=

# 自动证书配置 (http / self / 空)
cert_mode=
cert_domain=
cert_key_length=ec-256
force_close_ssl=false

# proxy protocol 中转配置
proxy_protocol=false
udp_proxy_protocol=false

# 全局限制用户 IP 数配置 (原生轻量 RESP 协议，无需重量级 SDK)
redis_ip_limit_enable=false
redis_ip_limit_addr=
redis_ip_limit_password=
redis_ip_limit_db=0
redis_ip_limit_tls=false
redis_ip_limit_expiry=60

# 动态限速配置
dy_limit_enable=false
dy_limit_trigger_time=60
dy_limit_trigger_speed=100
dy_limit_speed=30
dy_limit_time=600
dy_limit_white_user_id=

# 流控与同步间隔
user_conn_limit=0
user_speed_limit=0
user_tcp_limit=0
node_speed_limit=0

check_interval=60
submit_interval=60
forbidden_bit_torrent=true
log_level=info

# ==================== CPU & 内存深度优化配置 ====================
enable_zero_copy=true
mem_limit_mb=128
gc_percent=50
conn_idle_sec=300
udp_idle_sec=60
