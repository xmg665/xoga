# ==================== 基础对接配置 (100% 兼容 soga.conf) ====================
type=v2board
server_type=vless
node_id=1
api=webapi

# webapi 对接信息
webapi_url=
webapi_key=

# 手动证书配置
cert_file=
key_file=

# 自动证书配置 (http / self / 空)
cert_mode=
cert_domain=
cert_key_length=ec-256
force_close_ssl=false

# DNS 与嗅探配置 (配合 /etc/xoga/dns.yml 与 routes.toml 解锁)
default_dns=
dns_strategy=ipv4_first
dns_cache_time=10
dns_config_url=
domain_sniff=true

# v2ray 兼容项
v2ray_reduce_memory=true
vless=false
vless_flow=

# proxy protocol 中转配置
proxy_protocol=false
udp_proxy_protocol=false

# 全局限制用户 IP 数配置 (兼容 redis_ip_limit_* 与旧版 redis_* 键名)
redis_enable=false
redis_addr=
redis_password=
redis_db=0
conn_limit_expiry=60

# 动态限速配置
dy_limit_enable=false
dy_limit_trigger_time=60
dy_limit_trigger_speed=100
dy_limit_speed=30
dy_limit_time=600
dy_limit_white_user_id=

# 流控、端口封禁与同步间隔
user_conn_limit=0
user_speed_limit=0
user_tcp_limit=0
node_speed_limit=0

check_interval=60
submit_interval=60
forbidden_bit_torrent=true
forbidden_ports=25,26,24,50,57,105,106,158,209,1109,24554,60177,60179,143,218,220,109,110,995,6881-6999,3076-3078,5200,6200,4662,4661,4242,1024-1299,5354
log_level=info

# ==================== CPU & 内存深度优化配置 ====================
enable_zero_copy=true
mem_limit_mb=0
gc_percent=100
conn_idle_sec=120
udp_idle_sec=60
